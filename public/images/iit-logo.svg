  <line x1="200" y1="40" x2="200" y2="250" stroke="#F5B700" stroke-width="4" />

  <!-- Text block -->
  <g fill="#1B3A6B" font-family="Georgia, 'Times New Roman', serif">
    <text x="224" y="118" font-size="72" font-weight="700" letter-spacing="-1">IIT</text>
    <text x="226" y="162" font-size="26" font-weight="600" letter-spacing="2">INSTITUT</text>
