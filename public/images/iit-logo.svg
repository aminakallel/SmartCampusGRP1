  <text x="260" y="302" font-size="22" fill="#1B3A6B" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" letter-spacing="1">Université Nord Américaine Privée</text>
  <line x1="40" y1="312" x2="480" y2="312" stroke="#F5B700" stroke-width="2.5" />
