    <path d="M118 112 C128 108, 140 112, 146 122 C150 130, 148 140, 140 146 C132 152, 120 150, 116 142 C113 136, 113 128, 118 112 Z" />
    <path d="M86 148 C100 144, 116 150, 124 160 C130 168, 128 180, 118 188 C106 197, 88 196, 78 186 C70 178, 70 164, 76 156 C79 152, 82 150, 86 148 Z" />
    <path d="M130 160 C142 156, 156 162, 162 174 C166 183, 162 194, 152 200 C142 206, 130 202, 126 192 C123 184, 124 174, 130 160 Z" />
    <path d="M62 172 C72 168, 82 172, 86 182 C89 189, 86 198, 78 202 C70 206, 60 202, 56 194 C53 187, 56 177, 62 172 Z" />
