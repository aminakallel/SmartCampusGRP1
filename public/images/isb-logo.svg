    <path d="M72 18 L72 40 Q77 43 81 38" fill="none" stroke="#F5B700" stroke-width="3" stroke-linecap="round" />
    <circle cx="83" cy="41" r="3.5" fill="#F5B700" />
  </g>

  <!-- Open book inside shield -->
  <g transform="translate(55, 105)">
