    <line x1="16" y1="46" x2="46" y2="52" stroke="#F5B700" stroke-width="3" stroke-linecap="round" />
    <line x1="99" y1="32" x2="69" y2="38" stroke="#F5B700" stroke-width="3" stroke-linecap="round" />
    <line x1="99" y1="46" x2="69" y2="52" stroke="#F5B700" stroke-width="3" stroke-linecap="round" />
